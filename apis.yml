aid: inzmo
name: INZMO
description: INZMO is a European insurtech, founded in 2017, delivering 100% digital,
  embedded insurance for consumer goods and rental deposits. Its products cover mobile
  phones, laptops and tablets, bicycles, e-scooters, and rental deposit warranties,
  sold direct-to-consumer and embedded into partner checkout flows. INZMO offers partners
  an embedded-insurance API that adds insurance to the customer journey with real-time
  policy issuance, payment, and delivery of policy documents, and applies AI and large
  language models to streamline fraud prevention and claims handling. INZMO is a portfolio
  company of 500 Global.
